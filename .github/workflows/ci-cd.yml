name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          export MONITORING_DATA_DIR=/tmp/monitoring
          export GRAFANA_PASSWORD=dummy
          export HEADSCALE_URL=https://headscale.example.com
          export TELEGRAM_BOT_TOKEN=dummy
          export TELEGRAM_CHAT_ID=dummy
          make check

  deploy:
    name: Deploy checked revision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy checked revision and verify service
        run: make ci-deploy
        env:
          DEPLOY_TRANSPORT_JSON: ${{ secrets.DEPLOY_TRANSPORT_JSON }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
