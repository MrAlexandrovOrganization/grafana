networks:
  prometheus-net:
    external: true
    name: prometheus-net
  loki-net:
    external: true
    name: loki-net
  jaeger-net:
    external: true
    name: jaeger-net
  # Generic network that data sources (e.g. location's PostgreSQL) join so
  # Grafana can reach them. Grafana stays unaware of any specific project.
  grafana-datasources-net:
    external: true
    name: grafana-datasources-net

services:
  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DATA_DIR}/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - ${MONITORING_DATA_DIR}/grafana-dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=marcusolsson-calendar-panel
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    networks:
      - prometheus-net
      - loki-net
      - jaeger-net
      - grafana-datasources-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 1.0g

volumes:
  grafana_data:
    name: observability_grafana_data
