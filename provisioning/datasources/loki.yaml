apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link trace_id in JSON log bodies to Jaeger.
        - name: trace_id
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-fA-F]{32})"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
