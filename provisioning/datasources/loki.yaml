apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link trace_id in log lines to Jaeger
        - name: trace_id
          matcherRegex: '"trace_id":"([^"]+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
