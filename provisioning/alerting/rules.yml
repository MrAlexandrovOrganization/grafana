apiVersion: 1

groups:
  - orgId: 1
    name: containers
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: container-memory-high
        title: ContainerMemoryHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                (container_memory_working_set_bytes{name!="",name!="transcriber-whisper-worker-1"}
                / container_spec_memory_limit_bytes{name!="",name!="transcriber-whisper-worker-1"})
                and container_spec_memory_limit_bytes{name!="",name!="transcriber-whisper-worker-1"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: 'Контейнер {{ or $labels.name "?" }}: память {{ with $values.B }}{{ humanizePercentage .Value }}{{ else }}нет данных{{ end }} (порог 80%)'
        labels:
          severity: warning
        isPaused: false

      - uid: container-memory-critical
        title: ContainerMemoryCritical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                (container_memory_working_set_bytes{name!="",name!="transcriber-whisper-worker-1"}
                / container_spec_memory_limit_bytes{name!="",name!="transcriber-whisper-worker-1"})
                and container_spec_memory_limit_bytes{name!="",name!="transcriber-whisper-worker-1"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0.9]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Контейнер {{ or $labels.name "?" }}: память {{ with $values.B }}{{ humanizePercentage .Value }}{{ else }}нет данных{{ end }} — риск OOM'
        labels:
          severity: critical
        isPaused: false

      - uid: container-oom
        title: ContainerOOMKilled
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: >
                increase(container_oom_events_total{name!="",name!="transcriber-whisper-worker-1"}[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: 'Контейнер {{ or $labels.name "?" }}: OOM-kill (память превысила лимит)'
        labels:
          severity: critical
        isPaused: false
