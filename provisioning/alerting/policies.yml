apiVersion: 1

muteTimes:
  - orgId: 1
    name: notifications-disabled
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"

policies:
  - orgId: 1
    receiver: grafana-default-email
    routes:
      - receiver: grafana-default-email
        mute_time_intervals:
          - notifications-disabled
    group_by:
      - grafana_folder
      - alertname
      - name
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
